{% extends "base.html" %}

{% block title %}Register | Electronic Voting Platform{% endblock %}

{% block content %}
  <h1>Register</h1>

  <form method="post" action="{{ url_for('auth.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="email">Email</label>
    <input type="email" id="email" name="email"
           autocomplete="email" required maxlength="255">

    <label for="password">Password</label>
    <input type="password" id="password" name="password"
           autocomplete="new-password" required>

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password"
           autocomplete="new-password" required>

    <label for="date_of_birth">Date of birth</label>
    <input type="date" id="date_of_birth" name="date_of_birth"
           autocomplete="bday" required>

    <label for="division">Electoral division</label>
    <input type="text" id="division" name="division"
           autocomplete="off" required maxlength="100">

    <button type="submit">Register</button>
  </form>

  <p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
